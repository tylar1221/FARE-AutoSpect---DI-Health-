<!-- static/db_manager.html - Database Management Console -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Manager - FARE AutoSpect</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #0f1419;
            --ink-mid: #374151;
            --ink-soft: #6b7280;
            --ink-muted: #9ca3af;
            --surface: #ffffff;
            --surface-2: #f8f9fb;
            --surface-3: #f1f3f7;
            --border: #e4e7ec;
            --border-2: #d1d5db;
            --blue: #1d4ed8;
            --blue-dim: #eff6ff;
            --green: #16a34a;
            --green-dim: #f0fdf4;
            --red: #dc2626;
            --red-dim: #fef2f2;
            --amber: #d97706;
            --amber-dim: #fffbeb;
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--surface-2);
            color: var(--ink);
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 26px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-logo {
            height: 42px;
            width: auto;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--ink);
        }

        .logo-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            color: var(--ink-muted);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface-2);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid var(--border);
        }

        .user-avatar {
            width: 30px;
            height: 30px;
            background: var(--blue-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--blue);
        }

        .logout-btn, .back-link {
            background: rgba(0,0,0,0.05);
            border: none;
            cursor: pointer;
            color: var(--ink-mid);
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .logout-btn:hover, .back-link:hover {
            background: var(--surface-3);
        }

        /* Main Container */
        .main-container {
            padding-top: 84px;
            height: 100vh;
            display: flex;
            gap: 20px;
            padding: 84px 24px 24px;
        }

        /* Left Panel - Query Editor */
        .query-panel {
            flex: 1;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .query-editor {
            flex: 1;
            padding: 20px;
        }

        .sql-textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            resize: vertical;
            color: var(--ink);
        }

        .sql-textarea:focus {
            outline: none;
            border-color: var(--blue);
        }

        .query-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--blue); color: white; }
        .btn-primary:hover { background: #1a3d9e; transform: translateY(-1px); }
        .btn-success { background: var(--green); color: white; }
        .btn-success:hover { background: #13833c; }
        .btn-danger { background: var(--red); color: white; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: var(--surface-3); color: var(--ink-mid); }
        .btn-secondary:hover { background: var(--border); }

        .quick-queries {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .quick-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-bottom: 10px;
        }

        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            padding: 5px 10px;
            font-size: 0.7rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
        }

        .quick-btn:hover {
            background: var(--blue-dim);
            border-color: var(--blue);
        }

        /* Right Panel - Results */
        .results-panel {
            flex: 1.5;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .results-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .results-table-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .results-table th {
            text-align: left;
            padding: 10px;
            background: var(--surface-2);
            position: sticky;
            top: 0;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .results-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
        }

        .results-table tr:hover {
            background: var(--surface-2);
        }

        .status-bar {
            padding: 12px 20px;
            border-top: 1px solid var(--border);
            background: var(--surface-2);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .status-success {
            color: var(--green);
        }

        .status-error {
            color: var(--red);
        }

        .status-info {
            color: var(--blue);
        }

        /* Table Info */
        .table-info {
            padding: 10px 20px;
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.75rem;
        }

        .table-badge {
            background: var(--blue-dim);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--blue);
            cursor: pointer;
        }

        .table-badge:hover {
            background: var(--blue-soft);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            z-index: 1100;
            animation: slideIn 0.3s ease;
            font-size: 0.85rem;
        }
        .toast-success { background: var(--green); }
        .toast-error { background: var(--red); }
        .toast-info { background: var(--blue); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-group">
        <img src="/static/logo.png" alt="FARE" class="top-logo" onerror="this.src='https://placehold.co/42x42?text=FARE'"/>
        <div class="brand-text">
            <div class="logo-name">FARE AutoSpect</div>
            <div class="logo-sub">Database Manager</div>
        </div>
    </div>
    <div class="header-right">
        <a href="/static/dashboard.html" class="back-link">← Back to Command Centre</a>
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">A</div>
            <span class="user-name" id="userName">Loading...</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
</header>

<div class="main-container">
    <!-- Left Panel - Query Editor -->
    <div class="query-panel">
        <div class="panel-header">
            <span><i class="bi bi-code-square"></i> SQL Query Editor</span>
            <button class="btn btn-secondary" onclick="clearQuery()">
                <i class="bi bi-eraser"></i> Clear
            </button>
        </div>
        <div class="query-editor">
            <textarea id="sqlQuery" class="sql-textarea" placeholder="SELECT * FROM health_di_cases;"></textarea>
            <div class="query-buttons">
                <button class="btn btn-primary" onclick="executeQuery()">
                    <i class="bi bi-play-fill"></i> Execute (Ctrl+Enter)
                </button>
                <button class="btn btn-success" onclick="formatQuery()">
                    <i class="bi bi-magic"></i> Format
                </button>
            </div>

            <!-- Quick Queries -->
            <div class="quick-queries">
                <div class="quick-title"><i class="bi bi-lightning-charge"></i> Quick Queries</div>
                <div class="quick-buttons">
                    <button class="quick-btn" onclick="setQuery('SELECT * FROM health_di_cases ORDER BY created_at DESC LIMIT 20;')">📋 All Cases</button>
                    <button class="quick-btn" onclick="setQuery('SELECT status, COUNT(*) FROM health_di_cases GROUP BY status;')">📊 Status Count</button>
                    <button class="quick-btn" onclick="setQuery('SELECT * FROM health_di_cases WHERE status = \'pending\';')">⏳ Pending Cases</button>
                    <button class="quick-btn" onclick="setQuery('SELECT * FROM health_scheduled_slots WHERE slot_date >= date(\'now\');')">📅 Upcoming Slots</button>
                    <button class="quick-btn" onclick="setQuery('SELECT case_id, COUNT(*) FROM health_case_documents GROUP BY case_id;')">📎 Documents Count</button>
                    <button class="quick-btn" onclick="setQuery('SELECT name, phone_number, created_at FROM health_di_cases ORDER BY created_at DESC LIMIT 10;')">📝 Recent Cases</button>
                </div>
            </div>

            <!-- Schema Info -->
            <div class="quick-queries" style="margin-top: 15px;">
                <div class="quick-title"><i class="bi bi-database"></i> Tables Schema</div>
                <div class="table-info" id="tableInfo">
                    <span class="table-badge" onclick="showTableSchema('health_di_cases')">📋 health_di_cases</span>
                    <span class="table-badge" onclick="showTableSchema('health_case_documents')">📎 health_case_documents</span>
                    <span class="table-badge" onclick="showTableSchema('health_scheduled_slots')">📅 health_scheduled_slots</span>
                    <span class="table-badge" onclick="showTableSchema('health_whatsapp_messages')">💬 health_whatsapp_messages</span>
                    <span class="table-badge" onclick="showTableSchema('health_health_questionnaires')">📝 health_health_questionnaires</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel - Results -->
    <div class="results-panel">
        <div class="results-header">
            <span><i class="bi bi-table"></i> Query Results</span>
            <button class="btn btn-secondary" onclick="exportResults()">
                <i class="bi bi-download"></i> Export CSV
            </button>
        </div>
        <div class="results-table-container" id="resultsContainer">
            <div style="text-align: center; padding: 60px; color: var(--ink-muted);">
                <i class="bi bi-terminal" style="font-size: 2rem;"></i>
                <p>Execute a query to see results</p>
            </div>
        </div>
        <div class="status-bar" id="statusBar">
            Ready
        </div>
    </div>
</div>

<script>
    // Authentication
    const authToken = localStorage.getItem('auth_token');
    const userStr = localStorage.getItem('user');
    
    if (!authToken || !userStr) {
        window.location.href = '/static/login.html';
    }
    
    let currentUser = null;
    try {
        currentUser = JSON.parse(userStr);
        document.getElementById('userName').textContent = currentUser.name || currentUser.username;
        document.getElementById('userAvatar').textContent = (currentUser.name || currentUser.username).charAt(0).toUpperCase();
    } catch(e) {
        window.location.href = '/static/login.html';
    }
    
    function getHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`
        };
    }
    
    function showToast(message, type = 'success') {
        const toast = document.createElement('div');
        toast.className = `toast toast-${type}`;
        toast.innerHTML = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    function logout() {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('user');
        window.location.href = '/static/login.html';
    }
    
    // Set query in textarea
    function setQuery(query) {
        document.getElementById('sqlQuery').value = query;
    }
    
    function clearQuery() {
        document.getElementById('sqlQuery').value = '';
    }
    
    function formatQuery() {
        let query = document.getElementById('sqlQuery').value;
        // Simple formatting - add newlines after keywords
        query = query.replace(/SELECT/gi, '\nSELECT')
                     .replace(/FROM/gi, '\nFROM')
                     .replace(/WHERE/gi, '\nWHERE')
                     .replace(/ORDER BY/gi, '\nORDER BY')
                     .replace(/GROUP BY/gi, '\nGROUP BY')
                     .replace(/LIMIT/gi, '\nLIMIT')
                     .replace(/INSERT INTO/gi, '\nINSERT INTO')
                     .replace(/UPDATE/gi, '\nUPDATE')
                     .replace(/DELETE FROM/gi, '\nDELETE FROM');
        document.getElementById('sqlQuery').value = query.trim();
    }
    
    // Execute SQL query
    async function executeQuery() {
        const sql = document.getElementById('sqlQuery').value.trim();
        if (!sql) {
            showToast('Please enter a SQL query', 'error');
            return;
        }
        
        const statusBar = document.getElementById('statusBar');
        statusBar.innerHTML = '<i class="bi bi-hourglass-split"></i> Executing query...';
        statusBar.className = 'status-bar status-info';
        
        try {
            const response = await fetch('/api/db/query', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ query: sql })
            });
            
            const result = await response.json();
            
            if (response.ok) {
                displayResults(result);
                let rowCount = 0;
if (result.row_count !== undefined) rowCount = result.row_count;
else if (result.data) rowCount = result.data.length;
else if (result.affected_rows !== undefined) rowCount = result.affected_rows;

statusBar.innerHTML = `<i class="bi bi-check-circle"></i> Query executed successfully. ${rowCount} row(s) returned.`;                statusBar.className = 'status-bar status-success';
            } else {
                statusBar.innerHTML = `<i class="bi bi-exclamation-triangle"></i> Error: ${result.error}`;
                statusBar.className = 'status-bar status-error';
                showToast(result.error, 'error');
            }
        } catch (error) {
            statusBar.innerHTML = `<i class="bi bi-exclamation-triangle"></i> Error: ${error.message}`;
            statusBar.className = 'status-bar status-error';
            showToast('Error executing query', 'error');
        }
    }
    
    // Display results in table
    // Display results in table
// Display results in table
function displayResults(result) {
    const container = document.getElementById('resultsContainer');
    
    console.log('Displaying result:', result); // Debug log
    
    // Check for affected_rows (INSERT/UPDATE/DELETE)
    if (result.affected_rows !== undefined && result.affected_rows !== null) {
        container.innerHTML = `
            <div style="text-align: center; padding: 60px; color: var(--green);">
                <i class="bi bi-check-circle" style="font-size: 3rem;"></i>
                <h3>Query Executed Successfully</h3>
                <p>${result.affected_rows} row(s) affected</p>
                ${result.last_id ? `<p>Last Insert ID: ${result.last_id}</p>` : ''}
            </div>
        `;
        return;
    }
    
    // Check if we have data
    if (!result.data || result.data.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 60px; color: var(--ink-muted);">
                <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                <p>Query returned no results</p>
            </div>
        `;
        return;
    }
    
    // Get columns from first row
    const columns = Object.keys(result.data[0]);
    
    let html = '<div style="overflow-x: auto;"><table class="results-table"><thead><tr>';
    columns.forEach(col => {
        html += `<th>${escapeHtml(col)}</th>`;
    });
    html += '</tr></thead><tbody>';
    
    result.data.forEach(row => {
        html += '<tr>';
        columns.forEach(col => {
            let value = row[col];
            if (value === null) value = '';  // Empty string
            else if (typeof value === 'object') value = JSON.stringify(value);
            else if (typeof value === 'string' && value.length > 100) value = value.substring(0, 100) + '...';
            html += `<td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; word-break: break-word;">${escapeHtml(String(value))}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody></table></div>';
    
    // Add row count info
    html += `<div style="padding: 10px; background: var(--surface-2); border-radius: 8px; margin-top: 10px; font-size: 0.75rem;">
        <i class="bi bi-info-circle"></i> Total: ${result.data.length} row(s) returned
    </div>`;
    
    container.innerHTML = html;
}    
    // Show table schema
    async function showTableSchema(tableName) {
        setQuery(`PRAGMA table_info(${tableName});`);
        executeQuery();
    }
    
    // Export results to CSV
    function exportResults() {
        const container = document.getElementById('resultsContainer');
        const table = container.querySelector('table');
        if (!table) {
            showToast('No results to export', 'error');
            return;
        }
        
        let csv = [];
        const rows = table.querySelectorAll('tr');
        
        rows.forEach(row => {
            const rowData = [];
            const cols = row.querySelectorAll('th, td');
            cols.forEach(col => {
                let text = col.innerText;
                if (text.includes(',') || text.includes('"')) {
                    text = `"${text.replace(/"/g, '""')}"`;
                }
                rowData.push(text);
            });
            csv.push(rowData.join(','));
        });
        
        const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `query_results_${new Date().toISOString().slice(0,19)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Exported to CSV', 'success');
    }
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Keyboard shortcut: Ctrl+Enter to execute
    document.getElementById('sqlQuery').addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            executeQuery();
        }
    });
</script>
</body>
</html>
