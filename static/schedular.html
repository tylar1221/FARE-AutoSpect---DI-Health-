<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>DI Health — Instant Scheduling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== GLOBAL VARIABLES ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e9edf2;
      --text1: #0f172a;
      --text2: #334155;
      --text3: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --red: #dc2626;
      --green: #10b981;
      --amber: #d97706;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(to bottom, #f8fafc 0%, #f4f7fb 100%);
      color: var(--text1);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ========== TOP BAR ========== */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 200;
      height: 76px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--border), 0 4px 24px rgba(0, 0, 0, 0.04);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.25);
    }

    .logo-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      color: #111827;
      letter-spacing: -0.2px;
    }

    .logo-sub {
      margin-top: 3px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: #9ca3af;
    }

    /* Calendar Indicator */
    .calendar-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 16px;
      padding: 4px 12px;
      background: #ecfdf5;
      border-radius: 20px;
      font-size: 0.65rem;
      color: #065f46;
      border: 1px solid #bbf7d0;
      font-family: 'DM Sans', sans-serif;
      cursor: help;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .hdr-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .pill-date {
      background: var(--surface2);
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text2);
      border: 1px solid var(--border);
    }

    .btn-nav {
      height: 38px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 16px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
    }

    .btn-nav:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-nav:hover {
      border-color: #3b82f6;
      color: #2563eb;
      background: #eff6ff;
    }

    /* ========== DASHBOARD LAYOUT ========== */
    .dashboard {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 28px 28px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
    }

    /* ========== CARDS ========== */
    .card {
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05), 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 10px 20px;
      flex-wrap: wrap;
    }

    .card-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: -0.2px;
    }

    /* ========== FILTER CHIPS ========== */
    .filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-chip {
      height: 36px;
      min-width: 78px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 16px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .filter-chip:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .filter-chip.active {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-color: #2563eb;
      color: white;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.18);
    }

    /* ========== TABLE ========== */
    .cases-table-container {
      overflow-x: auto;
    }

    .cases-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }

    .cases-table th {
      text-align: left;
      padding: 14px 16px;
      background: var(--surface2);
      font-weight: 600;
      color: var(--text2);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border);
    }

    .cases-table td {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      font-size: 0.78rem;
    }

    .case-row {
      transition: background 0.15s;
      cursor: pointer;
    }

    .case-row:hover {
      background: #fafcff;
    }

    .case-row .folder-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 6px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      transition: all 0.2s;
      display: inline-block;
    }

    .case-row .folder-link:hover {
      background: #dbeafe;
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    .case-row .folder-link i {
      margin-right: 4px;
    }

    /* ========== BOOK NOW BUTTON ========== */
    .book-now-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'DM Sans', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .book-now-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
    }

    .book-now-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .book-now-btn.booked {
      background: #9ca3af;
      cursor: default;
      box-shadow: none;
    }

    .book-now-btn.booked:hover {
      transform: none;
      box-shadow: none;
    }

    .book-now-btn .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ========== STATUS BADGES ========== */
    .badge-status {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.63rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .badge-pending {
      background: #fef9e3;
      color: #b45309;
    }
    .badge-scheduled {
      background: #e0f2fe;
      color: #0369a1;
    }
    .badge-completed {
      background: #dcfce7;
      color: #166534;
    }
    .badge-non_workable {
      background: #fef2f2;
      color: #991b1b;
    }

    /* ========== STATS ========== */
    .stat-list {
      padding: 16px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 0.78rem;
      border-bottom: 1px solid var(--surface2);
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-row strong {
      font-weight: 600;
    }

    .icon-btn {
      height: 38px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0 16px;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
    }

    .icon-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.8rem;
      z-index: 2000;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .toast.error {
      background: #991b1b;
    }

    .toast.success {
      background: #065f46;
    }

    .toast a {
      color: white;
      text-decoration: underline;
    }

    /* ========== EHR DROPDOWN ========== */
    .ehr-dropdown {
      position: relative;
      display: inline-block;
    }

    .ehr-toggle {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text2);
    }

    .ehr-toggle:hover {
      background: var(--surface2);
      border-color: var(--primary);
      color: var(--primary);
    }

    .ehr-toggle i {
      font-size: 0.65rem;
    }

    .ehr-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      min-width: 180px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      z-index: 100;
      overflow: hidden;
      margin-top: 4px;
      animation: slideDown 0.2s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .ehr-menu.show {
      display: block;
    }

    .ehr-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      font-size: 0.75rem;
      color: var(--text2);
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'DM Sans', sans-serif;
    }

    .ehr-menu-item:hover {
      background: var(--surface2);
      color: var(--text1);
    }

    .ehr-menu-item i {
      width: 16px;
      font-size: 0.85rem;
      color: var(--text3);
    }

    .ehr-menu-item:hover i {
      color: var(--primary);
    }

    .ehr-menu-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .action-cell {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        padding: 0 16px;
        height: 64px;
        flex-wrap: wrap;
      }
      .dashboard {
        padding: 16px;
      }
      .filter-bar {
        gap: 4px;
      }
      .filter-chip {
        font-size: 0.65rem;
        padding: 0 10px;
        height: 30px;
        min-width: 60px;
      }
      .hdr-actions .pill-date {
        display: none;
      }
      .card-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .cases-table {
        font-size: 0.7rem;
      }
      .cases-table td,
      .cases-table th {
        padding: 10px 8px;
      }
      .action-cell {
        flex-direction: column;
        gap: 4px;
      }
    }

    @media (max-width: 480px) {
      .cases-table td,
      .cases-table th {
        padding: 8px 6px;
        font-size: 0.65rem;
      }
      .book-now-btn {
        font-size: 0.6rem;
        padding: 4px 10px;
      }
      .ehr-toggle {
        font-size: 0.6rem;
        padding: 4px 10px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="logo-text">
        <div class="logo-title">DI Health</div>
        <div class="logo-sub">Instant Scheduling</div>
      </div>
      <div class="calendar-indicator" id="calendarIndicator">
        <span>📅</span>
        <span id="calendarShortId">Loading...</span>
      </div>
    </div>
    <div class="hdr-actions">
      <span class="pill-date" id="todayDate"></span>
      <button class="btn-nav" onclick="window.location.href='/static/dashboard.html'">← Dashboard</button>
      <button class="icon-btn" id="refreshAllBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
  </div>

  <div class="dashboard">
    <!-- LEFT COLUMN: Cases -->
    <div class="cases-panel">
      <div class="card">
        <div class="card-header">
          <h3><i class="fas fa-users" style="color:var(--primary);margin-right:8px;"></i>Cases</h3>
          <div class="filter-bar" id="filterBar">
            <button data-status="all" class="filter-chip">All</button>
            <button data-status="pending" class="filter-chip active">Pending</button>
            <button data-status="scheduled" class="filter-chip">Scheduled</button>
            <button data-status="completed" class="filter-chip">Completed</button>
            <button data-status="non_workable" class="filter-chip">Non-workable</button>
          </div>
        </div>
        <div class="cases-table-container">
          <table class="cases-table">
            <thead>
              <tr>
                <th>Case ID</th>
                <th>Patient</th>
                <th>Status</th>
                <th>Phone</th>
                <th>Folder</th>
                <th style="width:200px;text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody id="casesTbody">
              <tr><td colspan="6"><div style="padding:40px;text-align:center;">Loading...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Stats -->
    <div class="right-panel">
      <div class="card">
        <div class="stat-list">
          <div style="font-weight:600;margin-bottom:8px;font-size:0.8rem;"><i class="fas fa-chart-pie" style="color:var(--primary);"></i> Overview</div>
          <div class="stat-row"><span>📋 Pending</span><span id="statPending">0</span></div>
          <div class="stat-row"><span>📅 Scheduled</span><span id="statScheduled">0</span></div>
          <div class="stat-row"><span>✅ Completed</span><span id="statCompleted">0</span></div>
          <div class="stat-row"><span>🚫 Non-workable</span><span id="statNonWorkable">0</span></div>
          <div class="stat-row" style="border-top:2px solid var(--border);margin-top:8px;padding-top:10px;">
            <strong>📊 Total Cases</strong><strong id="statTotal">0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    const API_BASE = window.location.origin;
    let allCases = [];
    let currentFilter = 'pending';
    let isLoading = false;
    let openDropdown = null;

    // ========== HELPERS ==========
    function showToast(msg, isErr = false) {
      let t = document.createElement('div');
      t.className = 'toast' + (isErr ? ' error' : ' success');
      t.innerHTML = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function getHeaders() {
      const token = localStorage.getItem('auth_token');
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    // ========== AUTH ==========
    (function () {
      const token = localStorage.getItem('auth_token');
      if (!token) window.location.href = '/static/login.html';
    })();

    // ========== FETCH CALENDAR INFO ==========
    async function fetchCalendarInfo() {
      try {
        const response = await fetch('/api/scheduling/calendar-info', { headers: getHeaders() });
        if (!response.ok) throw new Error('Failed to fetch calendar info');
        const data = await response.json();

        const indicator = document.getElementById('calendarIndicator');
        const shortId = document.getElementById('calendarShortId');

        if (data.is_authenticated) {
          const calendarName = data.calendar_name || 'DI Health Calendar';
          const displayName = calendarName.length > 28 ? calendarName.substring(0, 25) + '…' : calendarName;
          shortId.textContent = displayName;
          indicator.style.background = '#ecfdf5';
          indicator.style.borderColor = '#bbf7d0';
          indicator.style.color = '#065f46';
          indicator.title = `📅 ${calendarName}\n🆔 ${data.calendar_id}`;
        } else {
          shortId.textContent = '⚠️ Not connected';
          indicator.style.background = '#fef2f2';
          indicator.style.borderColor = '#fecaca';
          indicator.style.color = '#991b1b';
          indicator.title = 'Calendar not connected';
        }
      } catch (error) {
        console.error('Error fetching calendar info:', error);
        document.getElementById('calendarShortId').textContent = '❌ Error';
      }
    }

    // ========== FETCH CASES ==========
    async function fetchCases() {
      try {
        const response = await fetch('/api/cases', { headers: getHeaders() });
        if (!response.ok) throw new Error('Failed to fetch cases');
        const data = await response.json();
        allCases = Array.isArray(data) ? data : (data.cases || data.data || []);
        renderCasesTable();
        updateStats();
      } catch (e) {
        console.error('Error fetching cases:', e);
        allCases = [];
        renderCasesTable();
      }
    }

    // ========== FETCH STATS ==========
    async function updateStats() {
      const pending = allCases.filter(c => c.status === 'pending').length;
      const scheduled = allCases.filter(c => c.status === 'scheduled').length;
      const completed = allCases.filter(c => c.status === 'completed').length;
      const nonWorkable = allCases.filter(c => c.status === 'non_workable' || c.status === 'failed').length;

      document.getElementById('statPending').textContent = pending;
      document.getElementById('statScheduled').textContent = scheduled;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statNonWorkable').textContent = nonWorkable;
      document.getElementById('statTotal').textContent = allCases.length;
    }

    // ========== EHR ACTIONS ==========
    async function sendReminder(caseId) {
      try {
        const response = await fetch(`/api/cases/${caseId}/reminder`, {
          method: 'POST',
          headers: getHeaders()
        });
        if (response.ok) {
          showToast(`✅ Reminder sent for case ${caseId}`);
        } else {
          const data = await response.json();
          showToast(`❌ ${data.detail || 'Failed to send reminder'}`, true);
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
      }
    }

    async function sendCompletion(caseId) {
      try {
        const response = await fetch(`/api/cases/${caseId}/completion`, {
          method: 'POST',
          headers: getHeaders()
        });
        if (response.ok) {
          showToast(`✅ Completion message sent for case ${caseId}`);
        } else {
          const data = await response.json();
          showToast(`❌ ${data.detail || 'Failed to send completion'}`, true);
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
      }
    }

    // ========== DROPDOWN TOGGLE ==========
    function toggleDropdown(caseId, event) {
      event.stopPropagation();
      const menuId = `ehr-menu-${caseId}`;
      const menu = document.getElementById(menuId);
      
      // Close any open dropdown
      if (openDropdown && openDropdown !== menu) {
        openDropdown.classList.remove('show');
      }
      
      if (menu) {
        menu.classList.toggle('show');
        openDropdown = menu.classList.contains('show') ? menu : null;
      }
    }

    // Close dropdowns when clicking outside
    document.addEventListener('click', function() {
      if (openDropdown) {
        openDropdown.classList.remove('show');
        openDropdown = null;
      }
    });

    // ========== BOOK NOW ==========
    async function bookNow(caseId) {
      if (isLoading) return;
      
      const caseObj = allCases.find(c => c.case_id === caseId);
      if (!caseObj) return;

      const status = String(caseObj.status).toLowerCase();
      if (['completed', 'cancelled', 'failed', 'scheduled'].includes(status)) {
        showToast(`❌ Case is already ${caseObj.status}`, true);
        return;
      }

      const btn = document.querySelector(`[data-case-id="${caseId}"] .book-now-btn`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Booking...';
      }

      isLoading = true;

      try {
        const today = new Date();
        const dateStr = formatYMD(today);
        
        const slotsResponse = await fetch(`/api/scheduling/slots?slot_date=${dateStr}`, { headers: getHeaders() });
        if (!slotsResponse.ok) throw new Error('Failed to check slots');
        const slotsData = await slotsResponse.json();
        
        const freeSlot = slotsData.slots?.find(s => s.is_available);
        
        if (!freeSlot) {
          showToast(`❌ No available slots today. Please try another day.`, true);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📅 Book Now';
          }
          isLoading = false;
          return;
        }

        const response = await fetch('/api/scheduling/book', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            case_id: caseId,
            slot_date: dateStr,
            slot_time: freeSlot.start,
            duration_minutes: 30
          })
        });

        const data = await response.json();

        if (response.ok) {
          const meetLink = data.meet_link || '';
          showToast(`✅ ${caseObj.name} booked! Meeting: ${freeSlot.start}`);
          
          if (meetLink) {
            setTimeout(() => {
              showToast(`🔗 <a href="${meetLink}" target="_blank">${meetLink}</a>`);
            }, 1500);
          }
          
          await fetchCases();
        } else {
          showToast(`❌ ${data.detail || 'Booking failed'}`, true);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📅 Book Now';
          }
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '📅 Book Now';
        }
      } finally {
        isLoading = false;
      }
    }

    function formatYMD(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ========== RENDER CASES TABLE ==========
    function renderCasesTable() {
      const tbody = document.getElementById('casesTbody');

      const filtered = allCases.filter(c => {
        if (currentFilter === 'all') return true;
        if (currentFilter === 'non_workable') {
          return ['non_workable', 'failed'].includes(c.status);
        }
        return c.status === currentFilter;
      });

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr><td colspan="6"><div style="padding:40px;text-align:center;color:var(--text3);">
            <i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
            No cases found
          </div></td></tr>`;
        return;
      }

      let html = '';
      filtered.forEach(c => {
        const driveLink = c.drive_link || '';
        const isScheduled = c.status === 'scheduled';
        const isCompleted = c.status === 'completed' || c.status === 'cancelled' || c.status === 'failed' || c.status === 'non_workable';
        const canBook = !isScheduled && !isCompleted;

        let actionHtml = '';
        if (isCompleted) {
          actionHtml = `<span style="font-size:0.6rem;color:var(--text3);">Done</span>`;
        } else if (isScheduled) {
          actionHtml = `<span style="font-size:0.6rem;color:var(--green);">✅ Scheduled</span>`;
        } else {
          actionHtml = `
            <button class="book-now-btn" onclick="event.stopPropagation(); bookNow('${c.case_id}')">
              📅 Book Now
            </button>
          `;
        }

        html += `
          <tr class="case-row" onclick="window.location.href='/static/case_info.html?id=${c.case_id}'">
            <td style="font-weight:600;font-size:0.85rem;">${escapeHtml(c.case_id)}</td>
            <td><strong>${escapeHtml(c.name || 'Unknown')}</strong></td>
            <td><span class="badge-status badge-${c.status}">${c.status}</span></td>
            <td style="font-size:0.7rem;font-family:monospace;">${escapeHtml(c.phone_number || c.phone || '—')}</td>
            <td>
              ${driveLink ? `<a href="${driveLink}" target="_blank" class="folder-link" onclick="event.stopPropagation();"><i class="fas fa-folder-open"></i> Drive</a>` : 
                           `<span style="color:var(--text3);font-size:0.65rem;">No folder</span>`}
            </td>
            <td style="text-align:center;">
              <div class="action-cell">
                ${actionHtml}
                <div class="ehr-dropdown" onclick="event.stopPropagation();">
                  <button class="ehr-toggle" onclick="toggleDropdown('${c.case_id}', event)">
                    <i class="fas fa-notes-medical"></i> EHR
                    <i class="fas fa-chevron-down" style="font-size:0.5rem;"></i>
                  </button>
                  <div class="ehr-menu" id="ehr-menu-${c.case_id}">
                    <button class="ehr-menu-item" onclick="event.stopPropagation(); sendReminder('${c.case_id}'); toggleDropdown('${c.case_id}', event);">
                      <i class="fas fa-bell"></i> Send Reminder
                    </button>
                    <div class="ehr-menu-divider"></div>
                    <button class="ehr-menu-item" onclick="event.stopPropagation(); sendCompletion('${c.case_id}'); toggleDropdown('${c.case_id}', event);">
                      <i class="fas fa-check-circle"></i> Send Completion
                    </button>
                  </div>
                </div>
              </div>
            </td>
          </tr>`;
      });

      tbody.innerHTML = html;
    }

    // ========== FULL REFRESH ==========
    async function fullRefresh() {
      showToast('🔄 Refreshing...');
      await fetchCases();
      showToast('✅ Refreshed');
    }

    // ========== EVENT LISTENERS ==========
    document.getElementById('refreshAllBtn').addEventListener('click', fullRefresh);

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-status');
        renderCasesTable();
      });
    });

    // ========== INIT ==========
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });

    fetchCases();
    fetchCalendarInfo();

    // Auto-refresh every 30 seconds
    setInterval(() => {
      fetchCases();
    }, 30000);
  </script>

</body>
