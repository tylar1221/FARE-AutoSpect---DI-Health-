<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>DI Health — Instant Scheduling</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========== GLOBAL VARIABLES ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface2: #f1f5f9;
      --border: #e9edf2;
      --text1: #0f172a;
      --text2: #334155;
      --text3: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --red: #dc2626;
      --green: #10b981;
      --amber: #d97706;
      --radius: 16px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(to bottom, #f8fafc 0%, #f4f7fb 100%);
      color: var(--text1);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ========== TOP BAR ========== */
    .top-bar {
      position: sticky; top: 0; z-index: 200;
      height: 76px; padding: 0 40px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 var(--border), 0 4px 24px rgba(0,0,0,0.04);
    }

    .logo { display: flex; align-items: center; gap: 14px; }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 12px;
      background: linear-gradient(135deg,#1d4ed8,#3b82f6);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 0.95rem; font-weight: 700;
      box-shadow: 0 4px 14px rgba(29,78,216,0.25);
    }
    .logo-title { font-family:'DM Serif Display',serif; font-size:1.15rem; color:#111827; letter-spacing:-0.2px; }
    .logo-sub { margin-top:3px; font-family:'JetBrains Mono',monospace; font-size:0.58rem; letter-spacing:1.8px; text-transform:uppercase; color:#9ca3af; }

    .hdr-actions { display: flex; align-items: center; gap: 14px; }
    .pill-date {
      background: var(--surface2); padding: 6px 16px; border-radius: 40px;
      font-size: 0.75rem; font-weight: 500; color: var(--text2);
      border: 1px solid var(--border);
    }

    .btn-nav {
      height: 38px; background: white; border: 1px solid var(--border);
      border-radius: 10px; padding: 0 16px;
      font-size: 0.76rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s ease;
      display: flex; align-items: center; gap: 7px;
      color: var(--text2); font-family: 'DM Sans', sans-serif;
    }
    .btn-nav:hover { background:#f8fafc; border-color:#cbd5e1; transform:translateY(-1px); }
    .btn-nav:hover { border-color:#3b82f6; color:#2563eb; background:#eff6ff; }

    /* ========== DASHBOARD LAYOUT ========== */
    .dashboard {
      max-width: 1440px; margin: 0 auto;
      padding: 32px 28px 28px;
      display: grid; grid-template-columns: 1fr 340px; gap: 24px;
    }

    /* ========== CARDS ========== */
    .card {
      background: var(--surface); border-radius: 18px;
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.04);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 20px 10px 20px; flex-wrap: wrap;
    }
    .card-header h3 { font-size:1.1rem; font-weight:600; font-family:'DM Sans',sans-serif; letter-spacing:-0.2px; }

    /* ========== FILTER CHIPS ========== */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip {
      height: 36px; min-width: 78px; background: white;
      border: 1px solid var(--border); border-radius: 999px; padding: 0 16px;
      font-size: 0.76rem; font-weight: 600; cursor: pointer;
      transition: all 0.18s ease; color: var(--text2);
      font-family: 'DM Sans', sans-serif;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .filter-chip:hover { background:#f8fafc; border-color:#cbd5e1; transform:translateY(-1px); }
    .filter-chip.active {
      background: linear-gradient(135deg,#2563eb,#3b82f6);
      border-color: #2563eb; color: white;
      box-shadow: 0 4px 14px rgba(37,99,235,0.18);
    }

    /* ========== TABLE ========== */
    .cases-table-container { overflow-x: auto; }
    .cases-table {
      width: 100%; border-collapse: collapse; font-size: 0.78rem;
    }
    .cases-table th {
      text-align: left; padding: 14px 16px; background: var(--surface2);
      font-weight: 600; color: var(--text2); font-size: 0.68rem;
      text-transform: uppercase; letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border);
    }
    .cases-table td {
      padding: 18px 16px; border-bottom: 1px solid var(--border);
      vertical-align: middle; font-size: 0.78rem;
    }
    .case-row { transition: background 0.15s; cursor: pointer; }
    .case-row:hover { background: #fafcff; }

    .case-row .folder-link {
      color: var(--primary); text-decoration: none; font-weight: 500;
      font-size: 0.7rem; padding: 4px 8px; border-radius: 6px;
      background: #eff6ff; border: 1px solid #bfdbfe; transition: all 0.2s;
      display: inline-block;
    }
    .case-row .folder-link:hover { background: #dbeafe; border-color: #93c5fd; transform: translateY(-1px); }
    .case-row .folder-link i { margin-right: 4px; }
#slotsModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #slotsModal.open { display: flex; }
    .slot-btn {
      padding: 10px 8px; border-radius: 10px; border: 1px solid var(--border);
      background: white; cursor: pointer; font-size: 0.78rem; font-weight: 600;
      transition: all 0.15s; text-align: center;
    }
    .slot-btn:hover { background: #eff6ff; border-color: #3b82f6; transform: translateY(-1px); }
    .slot-btn.taken {
      background: #f8fafc; color: var(--text3); cursor: not-allowed;
      text-decoration: line-through; opacity: 0.6;
    }
    .slot-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px; padding: 16px 20px;
    }
    /* ========== BOOK NOW BUTTON ========== */
    .book-now-btn {
      padding: 6px 14px; border-radius: 20px; border: none;
      font-size: 0.72rem; font-weight: 600; cursor: pointer;
      transition: all 0.25s ease; font-family: 'DM Sans', sans-serif;
      display: inline-flex; align-items: center; gap: 5px;
      background: linear-gradient(135deg,#2563eb,#3b82f6);
      color: white; box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }
    .book-now-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(37,99,235,0.35); }
    .book-now-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .book-now-btn.booked { background: #9ca3af; cursor: default; box-shadow: none; }
    .book-now-btn.booked:hover { transform: none; box-shadow: none; }

    .book-now-btn .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3); border-radius: 50%;
      border-top-color: white; animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== STATUS BADGES ========== */
    .badge-status {
      display: inline-flex; align-items: center;
      padding: 5px 12px; border-radius: 999px;
      font-size: 0.63rem; font-weight: 600;
      letter-spacing: 0.3px; text-transform: uppercase;
    }
    .badge-pending { background:#fef9e3; color:#b45309; }
    .badge-scheduled { background:#e0f2fe; color:#0369a1; }
    .badge-completed { background:#dcfce7; color:#166534; }
    .badge-non_cooperation { background:#fef2f2; color:#991b1b; }

    /* ========== STATS ========== */
    .stat-list { padding: 16px; }
    .stat-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; font-size: 0.78rem;
      border-bottom: 1px solid var(--surface2);
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-row strong { font-weight: 600; }

    .icon-btn {
      height: 38px; background: white; border: 1px solid var(--border);
      border-radius: 10px; padding: 0 16px;
      font-size: 0.76rem; font-weight: 500; cursor: pointer;
      transition: all 0.18s ease; display: flex; align-items: center; gap: 7px;
      color: var(--text2); font-family: 'DM Sans', sans-serif;
    }
    .icon-btn:hover { background:#f8fafc; border-color:#cbd5e1; transform:translateY(-1px); }
.badge-non_cooperation { background:#fef2f2; color:#991b1b; }

    /* ========== TOAST ========== */
    .toast {
      position: fixed; bottom: 20px; left: 20px;
      background: #0f172a; color: white;
      padding: 10px 20px; border-radius: 30px;
      font-size: 0.8rem; z-index: 2000; max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .toast.error { background: #991b1b; }
    .toast.success { background: #065f46; }
    .toast a { color: white; text-decoration: underline; }

    /* ========== EHR DROPDOWN ========== */
    .ehr-dropdown { position: relative; display: inline-block; }
    .ehr-toggle {
      padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: white; font-size: 0.72rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text2);
    }
    .ehr-toggle:hover { background: var(--surface2); border-color: var(--primary); color: var(--primary); }
    .ehr-toggle i { font-size: 0.65rem; }

    .ehr-menu {
      display: none; position: absolute; right: 0; top: 100%;
      min-width: 180px; background: white;
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12); z-index: 100;
      overflow: hidden; margin-top: 4px;
      animation: slideDown 0.2s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ehr-menu.show { display: block; }
    .ehr-menu-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; font-size: 0.75rem; color: var(--text2);
      cursor: pointer; transition: all 0.15s;
      border: none; background: none; width: 100%;
      text-align: left; font-family: 'DM Sans', sans-serif;
    }
    .ehr-menu-item:hover { background: var(--surface2); color: var(--text1); }
    .ehr-menu-item i { width: 16px; font-size: 0.85rem; color: var(--text3); }
    .ehr-menu-item:hover i { color: var(--primary); }
    .ehr-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

    .action-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    /* ========== MESSAGES MODAL ========== */
    #msgModal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: center; justify-content: center;
    }
    #msgModal.open { display: flex; }
    .msg-modal-content {
      background: white; border-radius: 20px;
      max-width: 800px; width: 95%; max-height: 90vh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .msg-modal-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: white; flex-shrink: 0;
    }
    .msg-modal-header h3 { font-size: 1rem; }
    .msg-modal-close {
      border: none; background: none; cursor: pointer;
      font-size: 1.2rem; color: var(--text3);
    }
    .msg-modal-close:hover { color: var(--red); }

    .msg-modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; min-height: 400px; }

    /* ========== CHAT BUBBLES ========== */
    .msg-conversation-body { display: none; flex-direction: column; }
    .msg-conversation-body.open { display: flex; }
    .msg-chevron.rotated { transform: rotate(180deg); }
    .chat-bubble-wrap { display: flex; flex-direction: column; gap: 6px; padding: 12px; }
    .bubble {
      padding: 8px 12px; border-radius: 18px;
      max-width: 85%; font-size: 0.75rem; position: relative;
      word-wrap: break-word;
    }
    .bubble.incoming { background: #f1f3f5; align-self: flex-start; }
    .bubble.outgoing { background: #e0f2fe; align-self: flex-end; }
    .bubble.reminder { background: #fffbeb; border-left: 3px solid #fde68a; }
    .bubble.completion { background: #f0fdf4; border-left: 3px solid #bbf7d0; }
    .bubble .time { font-size: 0.6rem; opacity: 0.6; margin-top: 4px; }
    .bubble .badge-text {
      font-size: 0.55rem; background: var(--surface2);
      padding: 1px 6px; border-radius: 4px; margin-left: 4px;
    }

    .reply-bar {
      display: flex; gap: 8px; padding: 8px 12px;
      border-top: 1px solid #e2e8f0; background: white; flex-shrink: 0;
    }
    .reply-bar textarea {
      flex: 1; border-radius: 20px; border: 1px solid #cbd5e1;
      padding: 6px 12px; font-family: 'DM Sans', monospace;
      font-size: 0.7rem; resize: none; min-height: 36px; max-height: 80px;
    }
    .reply-bar textarea:focus { outline: none; border-color: var(--primary); }
    .reply-bar button {
      background: var(--primary); border: none; color: white;
      border-radius: 30px; padding: 0 18px; font-weight: 600;
      cursor: pointer; transition: all 0.18s ease;
    }
    .reply-bar button:hover { background: var(--primary-dark); }
    .reply-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Responsive */
    @media (max-width: 1024px) { .dashboard { grid-template-columns: 1fr; } }
    @media (max-width: 768px) {
      .top-bar { padding: 0 16px; height: 64px; flex-wrap: wrap; }
      .dashboard { padding: 16px; }
      .filter-bar { gap: 4px; }
      .filter-chip { font-size: 0.65rem; padding: 0 10px; height: 30px; min-width: 60px; }
      .hdr-actions .pill-date { display: none; }
      .card-header { flex-direction: column; align-items: flex-start; gap: 8px; }
      .cases-table { font-size: 0.7rem; }
      .cases-table td, .cases-table th { padding: 10px 8px; }
      .action-cell { flex-direction: column; gap: 4px; }
      .msg-modal-content { max-width: 100%; width: 100%; max-height: 100vh; border-radius: 0; }
    }
    @media (max-width: 480px) {
      .cases-table td, .cases-table th { padding: 8px 6px; font-size: 0.65rem; }
      .book-now-btn { font-size: 0.6rem; padding: 4px 10px; }
      .ehr-toggle { font-size: 0.6rem; padding: 4px 10px; }
    }

    .badge-unread {
      position: absolute; top: -4px; right: -6px;
      background: var(--red); color: white;
      font-size: 0.6rem; border-radius: 30px;
      padding: 2px 6px; display: none;
    }
    .msg-badge { position: relative; }
  </style>
</head>

<body>

  <div class="top-bar">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-calendar-check"></i></div>
      <div class="logo-text">
        <div class="logo-title">DI Health</div>
        <div class="logo-sub">Instant Scheduling</div>
      </div>
      <div class="calendar-indicator" id="calendarIndicator">
        <span>📅</span>
        <span id="calendarShortId">Loading...</span>
      </div>
    </div>
    <div class="hdr-actions">
      <span class="pill-date" id="todayDate"></span>
      <button class="btn-nav" onclick="window.location.href='/static/dashboard.html'">← Dashboard</button>
      <button class="icon-btn" id="refreshAllBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
      <div style="position:relative;">
        <button class="icon-btn" id="msgBtn"><i class="fas fa-comment-dots"></i> Messages</button>
        <span id="msgBadge" class="badge-unread"></span>
      </div>
    </div>
  </div>

  <div class="dashboard">
    <!-- LEFT COLUMN: Cases -->
    <div class="cases-panel">
      <div class="card">
        <div class="card-header">
          <h3><i class="fas fa-users" style="color:var(--primary);margin-right:8px;"></i>Cases</h3>
          <div class="filter-bar" id="filterBar">
            <button data-status="all" class="filter-chip">All</button>
            <button data-status="pending" class="filter-chip active">Pending</button>
            <button data-status="scheduled" class="filter-chip">Scheduled</button>
            <button data-status="completed" class="filter-chip">Completed</button>
            <button data-status="non_cooperation" class="filter-chip">Non-workable</button>
          </div>
        </div>
        <div class="cases-table-container">
          <table class="cases-table">
            <thead>
              <tr>
                <th>Case ID</th>
                <th>Patient</th>
                <th>Status</th>
                <th>Phone</th>
                <th>Folder</th>
                <th style="width:200px;text-align:center;">Action</th>
              </tr>
            </thead>
            <tbody id="casesTbody">
              <tr><td colspan="6"><div style="padding:40px;text-align:center;">Loading...</div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Stats -->
    <div class="right-panel">
      <div class="card">
        <div class="stat-list">
          <div style="font-weight:600;margin-bottom:8px;font-size:0.8rem;"><i class="fas fa-chart-pie" style="color:var(--primary);"></i> Overview</div>
          <div class="stat-row"><span>📋 Pending</span><span id="statPending">0</span></div>
          <div class="stat-row"><span>📅 Scheduled</span><span id="statScheduled">0</span></div>
          <div class="stat-row"><span>✅ Completed</span><span id="statCompleted">0</span></div>
          <div class="stat-row"><span>🚫 Non-workable</span><span id="statNonWorkable">0</span></div>
          <div class="stat-row" style="border-top:2px solid var(--border);margin-top:8px;padding-top:10px;">
            <strong>📊 Total Cases</strong><strong id="statTotal">0</strong>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MESSAGES MODAL ========== -->
  <div id="msgModal">
    <div class="msg-modal-content">
      <div class="msg-modal-header">
        <h3><i class="fas fa-comment-dots" style="color:var(--primary);"></i> WhatsApp Messages</h3>
        <div style="display:flex;gap:8px;align-items:center;">
          <button onclick="refreshMessages()" style="border:none;background:none;cursor:pointer;font-size:0.9rem;color:var(--text3);padding:4px 8px;" title="Refresh">
            <i class="fas fa-sync-alt"></i>
          </button>
          <button onclick="markAllRead()" style="border:none;background:none;cursor:pointer;font-size:0.8rem;color:var(--text3);padding:4px 8px;" title="Mark all read">
            ✓ All Read
          </button>
          <button class="msg-modal-close" onclick="closeMsgModal()">×</button>
        </div>
      </div>
      <div style="padding:8px 20px 12px;border-bottom:1px solid var(--border);background:#f8fafc;flex-shrink:0;">
        <div style="display:flex;gap:8px;align-items:center;">
          <i class="fas fa-search" style="color:var(--text3);font-size:0.8rem;"></i>
          <input type="text" id="msgSearchInput" placeholder="Search by Case ID, Claim ID, Name, or Phone..." 
            style="flex:1;height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--border);font-size:0.8rem;font-family:'DM Sans',sans-serif;outline:none;background:white;transition:all 0.18s ease;"
            onfocus="this.style.borderColor='#3b82f6';this.style.boxShadow='0 0 0 3px rgba(59,130,246,0.12)'"
            onblur="this.style.borderColor='';this.style.boxShadow='none'"
          />
          <button id="msgSearchClearBtn" style="display:none;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:white;cursor:pointer;font-size:0.7rem;color:var(--text3);">✕</button>
        </div>
        <div id="msgSearchResults" style="font-size:0.7rem;color:var(--text3);margin-top:4px;display:none;"></div>
      </div>
      <div class="msg-modal-body" id="msgListDiv">
        <div style="text-align:center;padding:40px;color:var(--text3);">Loading messages...</div>
      </div>
    </div>
  </div>
<!-- ========== SLOTS PICKER MODAL ========== -->
  <div id="slotsModal">
    <div class="msg-modal-content" style="max-width:600px;">
      <div class="msg-modal-header">
        <h3><i class="fas fa-calendar-alt" style="color:var(--primary);"></i> Choose a Slot — <span id="slotsCaseId"></span></h3>
        <button class="msg-modal-close" onclick="closeSlotsModal()">×</button>
      </div>
      <div style="padding:12px 20px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;">
        <label style="font-size:0.8rem;color:var(--text2);">Date:</label>
        <input type="date" id="slotsDateInput" style="padding:6px 10px;border-radius:8px;border:1px solid var(--border);font-size:0.8rem;">
      </div>
      <div class="msg-modal-body" id="slotsListDiv" style="min-height:200px;">
        <div style="text-align:center;padding:40px;color:var(--text3);">Loading slots...</div>
      </div>
    </div>
  </div>
  <script>
    // ========== CONFIG ==========
    const API_BASE = window.location.origin;
    let allCases = [];
    let currentFilter = 'pending';
    let isLoading = false;
    let openDropdown = null;

    // ========== HELPERS ==========
    function showToast(msg, isErr = false) {
      let t = document.createElement('div');
      t.className = 'toast' + (isErr ? ' error' : ' success');
      t.innerHTML = msg;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 4000);
    }

    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function getHeaders() {
      const token = localStorage.getItem('auth_token');
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      };
    }

    function formatPhoneNumber(phone) {
      const cleaned = String(phone).replace(/\D/g, '');
      if (cleaned.length === 10) return cleaned.replace(/(\d{5})(\d{5})/, '$1 $2');
      if (cleaned.length === 12 && cleaned.startsWith('91')) return '+91 ' + cleaned.substring(2, 7) + ' ' + cleaned.substring(7);
      return phone;
    }

    (function () {
      const token = localStorage.getItem('auth_token');
      if (!token) window.location.href = '/static/login.html';
    })();

    // ========== FETCH CASES ==========
    async function fetchCases() {
      try {
        const response = await fetch('/api/cases', { headers: getHeaders() });
        if (!response.ok) throw new Error('Failed to fetch cases');
        const data = await response.json();
        allCases = Array.isArray(data) ? data : (data.cases || data.data || []);
        renderCasesTable();
        updateStats();
      } catch (e) {
        console.error('Error fetching cases:', e);
        allCases = [];
        renderCasesTable();
      }
    }

    // ========== FETCH STATS ==========
    async function updateStats() {
      const pending = allCases.filter(c => c.status === 'pending').length;
      const scheduled = allCases.filter(c => c.status === 'scheduled').length;
      const completed = allCases.filter(c => c.status === 'completed').length;
      const nonWorkable = allCases.filter(c => c.status === 'non_cooperation' || c.status === 'failed').length;

      document.getElementById('statPending').textContent = pending;
      document.getElementById('statScheduled').textContent = scheduled;
      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statNonWorkable').textContent = nonWorkable;
      document.getElementById('statTotal').textContent = allCases.length;
    }

    // ========== BOOK NOW ==========
    async function bookNow(caseId) {
      if (isLoading) return;
      
      const caseObj = allCases.find(c => c.case_id === caseId);
      if (!caseObj) return;

      const status = String(caseObj.status).toLowerCase();
      if (['completed', 'cancelled', 'failed', 'scheduled'].includes(status)) {
        showToast(`❌ Case is already ${caseObj.status}`, true);
        return;
      }

      const btn = document.querySelector(`[data-case-id="${caseId}"] .book-now-btn`);
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Booking...';
      }

      isLoading = true;

      try {
        const today = new Date();
        const dateStr = formatYMD(today);
        
        const slotsResponse = await fetch(`/api/scheduling/slots?slot_date=${dateStr}`, { headers: getHeaders() });
        if (!slotsResponse.ok) throw new Error('Failed to check slots');
        const slotsData = await slotsResponse.json();
        
        const freeSlot = slotsData.slots?.find(s => s.is_available);
        
        if (!freeSlot) {
          showToast(`❌ No available slots today. Please try another day.`, true);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📅 Book Now';
          }
          isLoading = false;
          return;
        }

        const response = await fetch('/api/scheduling/book', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            case_id: caseId,
            slot_date: dateStr,
            slot_time: freeSlot.start,
            duration_minutes: 10
          })
        });

        const data = await response.json();

        if (response.ok) {
          const meetLink = data.meet_link || '';
          showToast(`✅ ${caseObj.name} booked! Meeting: ${freeSlot.start}`);
          
          if (meetLink) {
            setTimeout(() => {
              showToast(`🔗 <a href="${meetLink}" target="_blank">${meetLink}</a>`);
            }, 1500);
          }
          
          await fetchCases();
        } else {
          showToast(`❌ ${data.detail || 'Booking failed'}`, true);
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = '📅 Book Now';
          }
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '📅 Book Now';
        }
      } finally {
        isLoading = false;
      }
    }

    function formatYMD(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // ========== BUILD PHONE TO CASE MAPPING ==========
    function buildPhoneToCaseMapping() {
      let phoneToCase = {};

      function addPhoneToMapping(phoneNumber, caseId, name, claimId) {
        if (!phoneNumber) return;
        const cleanPhone = String(phoneNumber).replace(/\D/g, '');
        if (!phoneToCase[cleanPhone]) {
          phoneToCase[cleanPhone] = {
            case_id: caseId,
            name: name || null,
            claim_id: claimId || null
          };
        }
      }

      allCases.forEach(c => {
        addPhoneToMapping(c.phone, c.case_id, c.name, c.claim_id);
        addPhoneToMapping(c.phone_number, c.case_id, c.name, c.claim_id);
        if (c.all_phones && Array.isArray(c.all_phones)) {
          c.all_phones.forEach(phoneObj => {
            const phoneNum = phoneObj.phone_number || phoneObj.phone;
            addPhoneToMapping(phoneNum, c.case_id, c.name, c.claim_id);
          });
        }
      });

      return phoneToCase;
    }

    // ========== LOAD MESSAGES ==========
    async function loadMessagesList(searchTerm = '') {
      const container = document.getElementById('msgListDiv');
      const searchResults = document.getElementById('msgSearchResults');

      container.innerHTML = '<div style="text-align:center;padding:40px;">Loading messages...</div>';

      try {
        const response = await fetch('/webhook/messages?limit=5000', { headers: getHeaders() });
        const data = await response.json();

        if (!data.success || !data.messages || data.messages.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);"><i class="fas fa-inbox" style="font-size:2rem;display:block;margin-bottom:12px;"></i>No messages found</div>';
          if (searchResults) searchResults.style.display = 'none';
          return;
        }

        // Build phone to case mapping
        const phoneToCase = buildPhoneToCaseMapping();

        // Build case_id to phone mapping
        let caseIdToPhone = {};
allCases.forEach(c => {
  const p = c.phone_number || c.phone;
  if (c.case_id && p && p !== '—') caseIdToPhone[c.case_id] = p;
});

        // Group messages by phone
        let grouped = {};
        data.messages.forEach(msg => {
          const isSystemLabel = (msg.from_number === 'system' || msg.from_number === 'System');
          const isOutgoing = isSystemLabel || !msg.is_incoming;
          let phone;

          if (!isOutgoing) {
            phone = msg.from_number;
          } else if (!isSystemLabel && /^\d{10,15}$/.test(String(msg.from_number || '').replace(/\D/g, ''))) {
            phone = String(msg.from_number).replace(/\D/g, '');
          } else {
            const m = msg.message_body?.match(/To\s+(\d{10,15})/);
            if (m) phone = m[1];
            else if (msg.case_id && caseIdToPhone[msg.case_id]) {
              phone = caseIdToPhone[msg.case_id];
            }
            if (!phone) return;
          }

          const cleanPhone = String(phone).replace(/\D/g, '');
          const caseInfo = phoneToCase[cleanPhone] || (msg.case_id ? { case_id: msg.case_id } : null);

          if (!grouped[cleanPhone]) {
            grouped[cleanPhone] = {
              phone: cleanPhone,
              messages: [],
              unread: 0,
              case_id: caseInfo?.case_id || null,
              name: caseInfo?.name || null,
              claim_id: caseInfo?.claim_id || null
            };
          }
          grouped[cleanPhone].messages.push({ ...msg, isOutgoing, isSystemLabel });
          if (!msg.is_read && !isOutgoing) grouped[cleanPhone].unread++;
        });

        Object.values(grouped).forEach(conv => conv.messages.sort((a, b) => new Date(a.sent_at || a.received_at) - new Date(b.sent_at || b.received_at)));

        // Apply search filter
        let conversations = Object.values(grouped);

        if (searchTerm && searchTerm.trim().length > 0) {
          const term = searchTerm.trim().toLowerCase();
          conversations = conversations.filter(conv => {
            const matchCaseId = conv.case_id && conv.case_id.toLowerCase().includes(term);
            const matchClaimId = conv.claim_id && conv.claim_id.toLowerCase().includes(term);
            const matchName = conv.name && conv.name.toLowerCase().includes(term);
            const matchPhone = conv.phone && conv.phone.includes(term);
            const matchMessage = conv.messages.some(msg =>
              msg.message_body && msg.message_body.toLowerCase().includes(term)
            );
            return matchCaseId || matchClaimId || matchName || matchPhone || matchMessage;
          });

          if (searchResults) {
            searchResults.style.display = 'block';
            searchResults.textContent = `${conversations.length} conversation${conversations.length !== 1 ? 's' : ''} found for "${searchTerm.trim()}"`;
          }
        } else {
          if (searchResults) searchResults.style.display = 'none';
        }

        // Sort conversations
        conversations.sort((a, b) => {
          const aLast = new Date(a.messages[a.messages.length - 1]?.sent_at || a.messages[a.messages.length - 1]?.received_at || 0);
          const bLast = new Date(b.messages[b.messages.length - 1]?.sent_at || b.messages[b.messages.length - 1]?.received_at || 0);
          return bLast - aLast;
        });

        if (!conversations.length) {
          container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3);">
            <i class="fas fa-search" style="font-size:2rem;display:block;margin-bottom:12px;opacity:0.5;"></i>
            No conversations found${searchTerm ? ` for "${searchTerm.trim()}"` : ''}
          </div>`;
          return;
        }

        // Render conversations
        container.innerHTML = conversations.map(conv => {
          const hasCaseInfo = conv.case_id || conv.name || conv.claim_id;

          return `
            <div style="margin-bottom:16px;border:0.5px solid #ddd;border-radius:16px;overflow:hidden;background:white;">
              <div onclick="toggleConversation('${conv.phone}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;cursor:pointer;background:#f5f5f5;">
                <div style="font-weight:600;font-size:0.78rem;flex:1;">
                  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                    ${conv.unread > 0 ? `<span style="background:#ef4444;color:white;border-radius:20px;padding:2px 8px;font-size:0.62rem;">${conv.unread} new</span>` : ''}
                    <span>📞 ${formatPhoneNumber(conv.phone)}</span>
                  </div>
                  ${hasCaseInfo ? `
                    <div style="font-size:0.7rem;color:#2563eb;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">
                      ${conv.case_id ? `<span style="background:#eff6ff;padding:2px 10px;border-radius:12px;">🆔 ${conv.case_id}</span>` : ''}
                      ${conv.claim_id ? `<span style="background:#f0fdf4;padding:2px 10px;border-radius:12px;">📋 ${conv.claim_id}</span>` : ''}
                      ${conv.name ? `<span style="background:#fef3c7;padding:2px 10px;border-radius:12px;">👤 ${escapeHtml(conv.name)}</span>` : ''}
                    </div>
                  ` : `
                    <div style="font-size:0.65rem;color:var(--text3);margin-top:3px;">Unknown case</div>
                  `}
                </div>
                <div class="msg-chevron" id="chevron-${conv.phone}" style="margin-left:10px;transition:transform 0.2s;">▼</div>
              </div>
              <div class="msg-conversation-body" id="body-${conv.phone}">
                <div class="chat-bubble-wrap" style="max-height:400px;overflow-y:auto;">
                  ${conv.messages.map(msg => {
                    const timeStr = new Date(msg.sent_at || msg.received_at).toLocaleString('en-IN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
                    let text = escapeHtml(msg.message_body || '');
                    let bubbleClass = 'bubble';
                    let extraStyle = '';
                    
                    if (msg.isOutgoing || msg.isSystemLabel) {
                      bubbleClass += ' outgoing';
                    } else {
                      bubbleClass += ' incoming';
                    }
                    
                    if (msg.message_type === 'reminder') {
                      bubbleClass += ' reminder';
                    }
                    if (msg.message_type === 'completion') {
                      bubbleClass += ' completion';
                    }
                    
                    return `<div class="${bubbleClass}" style="${extraStyle}">
                      ${text}
                      <div class="time">${timeStr}${msg.isOutgoing ? ' ✓✓' : ''}</div>
                    </div>`;
                  }).join('')}
                </div>
                <div class="reply-bar">
                  <textarea id="reply-text-${conv.phone}" rows="1" placeholder="Type a reply..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply('${conv.phone}');}"></textarea>
                  <button onclick="sendReply('${conv.phone}')">Send</button>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Auto-expand conversations with unread messages
        conversations.forEach(conv => {
          if (conv.unread > 0) {
            const body = document.getElementById(`body-${conv.phone}`);
            const chevron = document.getElementById(`chevron-${conv.phone}`);
            if (body && !body.classList.contains('open')) {
              body.classList.add('open');
              if (chevron) chevron.classList.add('rotated');
            }
          }
        });

      } catch (e) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:#dc2626;">Error: ${e.message}</div>`;
        console.error('Error loading messages:', e);
      }
    }

    // ========== SEND REPLY ==========
    async function sendReply(phone) {
      const textarea = document.getElementById(`reply-text-${phone}`);
      const message = textarea.value.trim();
      if (!message) { showToast('Please enter a message', true); return; }

      showToast(`Sending to ${phone}...`);
      try {
        const caseWithPhone = allCases.find(c => c.phone === phone || c.phone === phone.replace('+', ''));
        const response = await fetch('/webhook/messages/send', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            case_id: caseWithPhone ? caseWithPhone.case_id : null,
            phone_number: phone,
            message: message
          })
        });
        const data = await response.json();
        if (data.success) {
          showToast(`✅ Message sent to ${phone}`);
          textarea.value = '';
          setTimeout(() => loadMessagesList(), 1000);
        } else {
          showToast(`❌ Failed: ${data.error || 'Unknown error'}`, true);
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
      }
    }

    // ========== MARK ALL READ ==========
    async function markAllRead() {
      try {
        await fetch('/webhook/messages/mark-all-read', {
          method: 'POST',
          headers: getHeaders()
        });
        showToast('✅ All messages marked as read');
        await loadMessagesList();
        await checkUnreadCount();
      } catch (e) {
        showToast('❌ Error marking all as read', true);
      }
    }
// ========== SLOTS PICKER ==========
    let currentSlotsCaseId = null;

    function openSlotsModal(caseId) {
      currentSlotsCaseId = caseId;
      document.getElementById('slotsCaseId').textContent = caseId;
      document.getElementById('slotsModal').classList.add('open');

      const dateInput = document.getElementById('slotsDateInput');
      dateInput.value = formatYMD(new Date());
      dateInput.onchange = () => loadSlotsForModal(dateInput.value);

      loadSlotsForModal(dateInput.value);
    }

    function closeSlotsModal() {
      document.getElementById('slotsModal').classList.remove('open');
      currentSlotsCaseId = null;
    }

    async function loadSlotsForModal(dateStr) {
      const container = document.getElementById('slotsListDiv');
      container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3);">Loading slots...</div>';

      try {
        const response = await fetch(`/api/scheduling/slots?slot_date=${dateStr}`, { headers: getHeaders() });
        const data = await response.json();

        if (!data.working_day) {
          container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3);">
            <i class="fas fa-calendar-times" style="font-size:2rem;display:block;margin-bottom:8px;"></i>
            ${data.message || 'Not a working day'}
          </div>`;
          return;
        }

        if (!data.slots || data.slots.length === 0) {
          container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text3);">No slots configured for this day</div>`;
          return;
        }

        const availableCount = data.slots.filter(s => s.is_available).length;

        container.innerHTML = `
          <div style="padding:8px 20px 0;font-size:0.75rem;color:var(--text3);">
            ${availableCount} of ${data.slots.length} slots available
          </div>
          <div class="slot-grid">
            ${data.slots.map(s => {
              if (s.is_available) {
                return `<button class="slot-btn" onclick="bookSpecificSlot('${dateStr}', '${s.start}')">${s.start} - ${s.end}</button>`;
              } else {
                return `<button class="slot-btn taken" disabled title="${s.booked_by || 'Booked'}">${s.start} - ${s.end}</button>`;
              }
            }).join('')}
          </div>
        `;
      } catch (e) {
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);">Error loading slots: ${e.message}</div>`;
      }
    }

    async function bookSpecificSlot(dateStr, timeStr) {
      if (!currentSlotsCaseId) return;
      if (!confirm(`Book ${currentSlotsCaseId} for ${dateStr} at ${timeStr}?`)) return;

      showToast(`Booking ${timeStr}...`);

      try {
        const response = await fetch('/api/scheduling/book', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            case_id: currentSlotsCaseId,
            slot_date: dateStr,
            slot_time: timeStr,
            duration_minutes: 10
          })
        });

        const data = await response.json();

        if (response.ok) {
          showToast(`✅ Booked ${timeStr} — meeting confirmed!`);
          closeSlotsModal();
          await fetchCases();
        } else {
          showToast(`❌ ${data.detail || 'Booking failed'}`, true);
          loadSlotsForModal(dateStr); // refresh in case slot got taken meanwhile
        }
      } catch (e) {
        showToast(`❌ Error: ${e.message}`, true);
      }
    }

    // Close slots modal on background click / Escape
    document.getElementById('slotsModal').addEventListener('click', function(e) {
      if (e.target === this) closeSlotsModal();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const m = document.getElementById('slotsModal');
        if (m.classList.contains('open')) closeSlotsModal();
      }
    });
    // ========== EVENT LISTENERS ==========
    document.getElementById('refreshAllBtn').addEventListener('click', fullRefresh);

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-status');
        renderCasesTable();
      });
    });

    // Messages button
    document.getElementById('msgBtn').addEventListener('click', openMessagesModal);

    // Messages search
    const msgSearchInput = document.getElementById('msgSearchInput');
    const msgSearchClearBtn = document.getElementById('msgSearchClearBtn');
    let msgSearchDebounce = null;

    if (msgSearchInput) {
      msgSearchInput.addEventListener('input', function() {
        const val = this.value;
        if (msgSearchClearBtn) {
          msgSearchClearBtn.style.display = val.length > 0 ? 'block' : 'none';
        }
        clearTimeout(msgSearchDebounce);
        msgSearchDebounce = setTimeout(() => {
          loadMessagesList(val);
        }, 300);
      });

      msgSearchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          this.value = '';
          if (msgSearchClearBtn) msgSearchClearBtn.style.display = 'none';
          const searchResults = document.getElementById('msgSearchResults');
          if (searchResults) searchResults.style.display = 'none';
          loadMessagesList('');
        }
      });
    }

    if (msgSearchClearBtn) {
      msgSearchClearBtn.addEventListener('click', function() {
        if (msgSearchInput) {
          msgSearchInput.value = '';
          this.style.display = 'none';
          const searchResults = document.getElementById('msgSearchResults');
          if (searchResults) searchResults.style.display = 'none';
          loadMessagesList('');
        }
      });
    }

    // Close modal on background click
    document.getElementById('msgModal').addEventListener('click', function(e) {
      if (e.target === this) closeMsgModal();
    });

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        const modal = document.getElementById('msgModal');
        if (modal.classList.contains('open')) closeMsgModal();
      }
    });

    // ========== INIT ==========
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'short',
      month: 'short',
      day: 'numeric'
    });

    fetchCases();
    fetchCalendarInfo();
    checkUnreadCount();

    // Auto-refresh every 30 seconds
    setInterval(() => {
      fetchCases();
      checkUnreadCount();
    }, 30000);
  </script>

</body>
</html>
